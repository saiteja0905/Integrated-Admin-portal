app = "sanyuth"
primary_region = "bom"

[env]
PORT = "8000"
PYTHONPATH = "/app"
# Job photos live on the mounted volume below, so they survive deploys and
# machine replacements (the container filesystem does not).
UPLOAD_DIR = "/data/uploads"

# Persistent storage for uploaded job photos.
# Create it once per region before the first deploy:
#   fly volumes create sanyuth_uploads --region bom --size 3
[[mounts]]
source = "sanyuth_uploads"
destination = "/data"

[experimental]
auto_rollback = true

  [experimental.attached]
  secrets = { }

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8000
min_machines_running = 1
processes = [ "app" ]

  [[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "10s"

[[statics]]
guest_path = "/app/static"
tigris_bucket = ""
url_prefix = "/static/"
