# fly.toml app configuration file generated for integrated-admin-portal on 2025-10-31T01:06:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'integrated-admin-portal'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
app = "sanyuth"
primary_region = "bom"

[env]
PORT = "8000"
PYTHONPATH = "/app"

[experimental]
auto_rollback = true

  [experimental.attached]
  secrets = { }

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8000
min_machines_running = 1
processes = [ "app" ]

  [[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "10s"

[[statics]]
guest_path = "/app/static"
tigris_bucket = ""
url_prefix = "/static/"
