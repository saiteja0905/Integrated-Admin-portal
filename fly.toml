# Fly.io configuration for Shidhaan Blue-collar Marketplace
app = "shidhaan-marketplace"
primary_region = "bom"  # Mumbai region for India

[build]

[env]
  PORT = "8000"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[machines]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"

# Database configuration
[[services]]
  protocol = "tcp"
  internal_port = 27017
  processes = ["app"]

  [[services.ports]]
    port = 27017
    handlers = ["tcp"]
    force_https = false

# Environment variables (set via fly secrets)
# MONGO_URL - MongoDB connection string
# DB_NAME - Database name
# JWT_SECRET - JWT secret key
# RAZORPAY_KEY_ID - Razorpay key ID
# RAZORPAY_KEY_SECRET - Razorpay secret
# REACT_APP_BACKEND_URL - Frontend backend URL
