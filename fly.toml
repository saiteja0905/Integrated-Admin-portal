# fly.toml app configuration file generated for integrated-admin-portal on 2025-10-31T01:06:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'integrated-admin-portal'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
