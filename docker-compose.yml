version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: shidhaan-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: shidhaan_marketplace
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - shidhaan-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Shidhaan Application (Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time argument for React app
        REACT_APP_BACKEND_URL: http://localhost:8000
    container_name: shidhaan-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Backend environment variables
      - MONGO_URL=mongodb://admin:password123@mongodb:27017
      - DB_NAME=shidhaan_marketplace
      # Read from your shell or a .env file next to this compose file.
      # If unset, the API generates a random secret on each start (sessions reset on restart).
      - JWT_SECRET=${JWT_SECRET:-}
      - RAZORPAY_KEY_ID=rzp_test_placeholder
      - RAZORPAY_KEY_SECRET=test_secret_placeholder
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000
      - UPLOAD_DIR=/app/uploads
    volumes:
      # Keep uploaded job photos across container rebuilds
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shidhaan-network

  # MongoDB Express (Database Admin UI - Optional)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: shidhaan-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shidhaan-network

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  shidhaan-network:
    driver: bridge
