version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: shidhaan-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: shidhaan_marketplace
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - shidhaan-network

  # Shidhaan Application
  app:
    build: .
    container_name: shidhaan-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://admin:password123@mongodb:27017
      - DB_NAME=shidhaan_marketplace
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - RAZORPAY_KEY_ID=rzp_test_your_key_id_here
      - RAZORPAY_KEY_SECRET=your_razorpay_secret_here
      - REACT_APP_BACKEND_URL=http://localhost:8000
    depends_on:
      - mongodb
    networks:
      - shidhaan-network
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend

  # MongoDB Express (Database Admin UI)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: shidhaan-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - shidhaan-network

volumes:
  mongodb_data:

networks:
  shidhaan-network:
    driver: bridge
